  AXIOMS.forEach((a, i) => {
    html += `<div class="axiom">
      <strong>${i + 1}. ${a.principle}</strong>
      <div class="d">${a.detail}</div>
    </div>`;
  });
  box.innerHTML = html;
}

function renderToolbar() {
  const bar = document.getElementById("toolbar");
  const total = WISDOM.length;
  let html = `<button class="theme-btn active" data-t="all">All · ${total}</button>`;
  for (const [key, label] of Object.entries(THEMES)) {
    const count = WISDOM.filter(w => w.theme === key).length;
    html += `<button class="theme-btn" data-t="${key}">${label} · ${count}</button>`;
  }
  html += `<input type="search" id="wisdomSearch" placeholder="Search principles…">`;
  bar.innerHTML = html;

  bar.querySelectorAll(".theme-btn").forEach(b => {
    b.addEventListener("click", () => {
      bar.querySelectorAll(".theme-btn").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      activeTheme = b.dataset.t;
      renderList();
    });
  });

  const search = document.getElementById("wisdomSearch");
  search.addEventListener("input", (e) => {
    searchQuery = e.target.value.toLowerCase().trim();
    renderList();
  });
}

function matchesFilter(w) {
  if (activeTheme !== "all" && w.theme !== activeTheme) return false;
  if (!searchQuery) return true;
  const blob = [
    w.principle, w.quant, w.why, w.violated_when,
    (w.sources || []).join(" ")
  ].join(" ").toLowerCase();
  return blob.includes(searchQuery);
}

function renderList() {
  const box = document.getElementById("list");
  const filtered = WISDOM.filter(matchesFilter);
  if (!filtered.length) {
    box.innerHTML = '<div class="empty">No principles match this filter.</div>';
    return;
  }

  // Group by theme
  const groups = {};
  filtered.forEach(w => {
    groups[w.theme] = groups[w.theme] || [];
    groups[w.theme].push(w);
  });

  // Preserve canonical theme order
  const order = Object.keys(THEMES);
  let html = "";
  order.forEach(themeKey => {
    const arr = groups[themeKey];
    if (!arr || !arr.length) return;
    html += `<div class="theme-group">
      <h3>${THEMES[themeKey]} · ${arr.length}</h3>`;
    arr.forEach(w => {
      const sources = (w.sources || [])
        .map(s => `<span class="src">${s}</span>`).join("");
      html += `<div class="card">
        <div class="principle">${w.principle}</div>
        <div class="quant">${w.quant}</div>
        <div class="row"><span class="label">Why</span>${w.why}</div>
        <div class="sources">${sources}</div>
        <div class="violated"><span class="label">Violated when</span>${w.violated_when}</div>
      </div>`;
    });
    html += `</div>`;
  });
  box.innerHTML = html;
}

renderAxioms();
renderToolbar();
renderList();
</script>
</body>
</html>
